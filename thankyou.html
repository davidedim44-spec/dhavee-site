<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dhavée Research Hub – Thank You</title>
  <meta name="description" content="Thank you for contacting Dhavée Research Hub.">
  <meta name="author" content="David Edim">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="icon-open">☰</span>
        <span class="icon-close">✖</span>
      </button>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="research.html">Research</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
    <div class="nav-overlay"></div>
  </header>

  <main>
    <div class="container">
      <div class="banner">
        <h1>Thank You!</h1>
        <p>Your message has been sent successfully. We’ll get back to you within 48 hours.</p>
      </div>

      <div class="card">
        <div class="card-body text-center">
          <a href="index.html" class="btn btn-primary">Return to Home</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-secondary">
    <p class="text-small">© 2026 Dhavée Research Hub · All rights reserved.</p>
  </footer>

  <!-- Navigation script -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const toggle = document.querySelector(".nav-toggle");
      const navLinks = document.querySelector(".nav-links");
      const overlay = document.querySelector(".nav-overlay");

      toggle.addEventListener("click", () => {
        navLinks.classList.toggle("active");
        toggle.classList.toggle("active");
        overlay.classList.toggle("active");
        document.body.classList.toggle("menu-open");
      });

      overlay.addEventListener("click", () => {
        navLinks.classList.remove("active");
        toggle.classList.remove("active");
        overlay.classList.remove("active");
        document.body.classList.remove("menu-open");
      });

      // Highlight current page link
      const links = document.querySelectorAll("nav a");
      const currentUrl = window.location.href;
      links.forEach(link => {
        if (currentUrl.includes(link.getAttribute("href"))) {
          link.classList.add("active");
        }
      });
    });
  </script>
</body>
</html>
