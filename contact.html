<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Dhavée Research Hub</title>
  <meta name="description" content="Reach out to Dhavée Research Hub for inquiries, collaborations, or philosophical discussions.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="research.html">Research</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <main>
    <div class="container">
      <h1>Contact the Research Hub</h1>
      <p>Fill out the form below to get in touch:</p>

      <!-- Welcoming image -->
      <img src="images/person-writing.jpg" alt="Person writing notes" class="hero">

      <form action="https://formspree.io/f/xbdbalrq" method="POST">
        <input type="hidden" name="_redirect" value="https://davidedim44-spec.github.io/dhavee-site/thankyou.html">

        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send</button>
      </form>
    </div>
  </main>

  <footer>
    <p>© 2026 Research Hub · All rights reserved.</p>
  </footer>
</body>
</html>
