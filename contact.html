<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dhavée Research Hub – Contact</title>
  <meta name="description" content="Reach out to Dhavée Research Hub for inquiries, collaborations, or philosophical discussions.">
  <meta name="keywords" content="Dhavée Research Hub, contact, inquiries, collaborations, philosophy discussions">
  <meta name="author" content="David Edim">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Social Sharing (Open Graph) -->
  <meta property="og:title" content="Dhavée Research Hub – Contact">
  <meta property="og:description" content="Get in touch with Dhavée Research Hub for inquiries, collaborations, or philosophical discussions.">
  <meta property="og:image" content="images/person-writing.jpg">
  <meta property="og:url" content="https://davidedim44-spec.github.io/dhavee-site/contact.html">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <!-- Hamburger toggle button -->
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="icon-open">☰</span>
        <span class="icon-close">✖</span>
      </button>

      <!-- Navigation links -->
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="research.html">Research</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
    <div class="nav-overlay"></div>
  </header>

  <main>
    <div class="container">

      <!-- Banner -->
      <div class="banner">
        <h1>Contact the Research Hub</h1>
        <p>We’d love to hear from you — whether it’s inquiries, collaborations, or philosophical discussions.</p>
      </div>

      <!-- Welcoming image -->
      <img src="images/person-writing.jpg" alt="Person writing notes" class="hero">

      <!-- Contact Form Card -->
      <div class="card">
        <div class="card-header">Get in Touch</div>
        <div class="card-body">
          <<form action="https://formspree.io/f/xbdbalrq" method="POST" class="contact-form">
           <label for="name">Your Name:</label>
            <input type="text" name="name" id="name" required>
            
            <label for="email">Your Email:</label>
            <input type="email" name="email" id="email" required>
            
            <label for="message">Message:</label>
             <textarea name="message" id="message" rows="5" required></textarea>
            
            <button type="submit" class="btn btn-primary">Send</button>
          </form>
        </div>
      </div>

      <!-- Callout -->
      <div class="callout">
        We respond to all messages within 48 hours.
      </div>

    </div>
  </main>

  <footer class="bg-secondary">
    <p class="text-small">© 2026 Dhavée Research Hub · All rights reserved.</p>
  </footer>

  <!-- Navigation toggle + active link script -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const toggle = document.querySelector(".nav-toggle");
      const navLinks = document.querySelector(".nav-links");
      const overlay = document.querySelector(".nav-overlay");

      toggle.addEventListener("click", () => {
        navLinks.classList.toggle("active");
        toggle.classList.toggle("active");
        overlay.classList.toggle("active");
        document.body.classList.toggle("menu-open");
      });

      overlay.addEventListener("click", () => {
        navLinks.classList.remove("active");
        toggle.classList.remove("active");
        overlay.classList.remove("active");
        document.body.classList.remove("menu-open");
      });

      // Highlight current page link
      const links = document.querySelectorAll("nav a");
      const currentUrl = window.location.href;
      links.forEach(link => {
        if (currentUrl.includes(link.getAttribute("href"))) {
          link.classList.add("active");
        }
      });
    });
  </script>
</body>
</html>
